name: PSTG_SPACA_ACA_CLAIM_TRANSACTION_STAGING_GB_UPDATE
operation:
  config:
    insertStrategy: INSERT
    postSQL: ""
    preSQL: |-
      BEGIN
        USE DATABASE ALLIANT_CLAIMS_ASTRUS_STAGE;
        
        UPDATE ALLIANT_CLAIMS_ASTRUS_STAGE.DBO.ACA_CLAIM_TRANSACTION_STAGING_GB s
        SET
            aca_claim_id = IFNULL(cl.aca_claim_id, -1),
            aca_claimant_id = IFNULL(c.aca_claimant_id, -1),
            aca_date_id_transaction_date = IFNULL(TRY_CAST(TO_CHAR(s_from.source_system_transaction_date, 'YYYYMMDD') AS INT), -1),
            aca_date_id_status_date = IFNULL(TRY_CAST(TO_CHAR(s_from.status_date, 'YYYYMMDD') AS INT), -1),
            aca_date_id_reported_date = IFNULL(TRY_CAST(TO_CHAR(s_from.reported_date, 'YYYYMMDD') AS INT), -1),
            aca_date_id_accident_date = IFNULL(TRY_CAST(TO_CHAR(s_from.accident_date, 'YYYYMMDD') AS INT), -1),
            aca_policy_id = IFNULL(p.aca_policy_id, -1),
            aca_claim_attribute_id = IFNULL(ca.aca_claim_attribute_id, -1),
            aca_current_flag = IFF(s_from.source_system_transaction_date = mx.max_transaction_date_per_claim, 'Y', 'N'),
            aca_transaction_date = s_from.source_system_transaction_date,
            max_transaction_date_per_claim = mx.max_transaction_date_per_claim,
            next_transaction_date = mx.next_transaction_date,
            aca_accident_source_code_id = IFNULL(asco.aca_accident_source_code_id, -1),
            description_of_loss = NULL,
            vehicle_identification_number = NULL,
            claimant = NULL,
            claimant_ssn = NULL,
            aca_source_system_id = src_sys.aca_source_system_id,
            aca_update_user = 'spaca_aca_claim_transaction_staging_gb_update',
            aca_date_updated = CURRENT_TIMESTAMP()
        FROM ALLIANT_CLAIMS_ASTRUS_STAGE.DBO.ACA_CLAIM_TRANSACTION_STAGING_GB AS s_from
        INNER JOIN (
            SELECT
                source_system_claim_id,
                source_system_transaction_date,
                DATEADD(
                    DAY,
                    -1,
                    LEAD(source_system_transaction_date, 1) OVER (
                        PARTITION BY source_system_claim_id
                        ORDER BY
                            source_system_transaction_date ASC
                    )
                ) AS next_transaction_date,
                MAX(source_system_transaction_date) OVER (PARTITION BY source_system_claim_id) AS max_transaction_date_per_claim
            FROM
                ALLIANT_CLAIMS_ASTRUS_STAGE.DBO.ACA_CLAIM_TRANSACTION_STAGING_GB
        ) AS mx ON s_from.source_system_claim_id = mx.source_system_claim_id AND s_from.source_system_transaction_date = mx.source_system_transaction_date
        CROSS JOIN (
            SELECT
                aca_source_system_id
            FROM
                ALLIANT_CLAIMS_ASTRUS.DBO.ACA_SOURCE_SYSTEM
            WHERE
                source_system = 'GB'
        ) AS src_sys
        LEFT OUTER JOIN ALLIANT_CLAIMS_ASTRUS.DBO.ACA_CLAIM AS cl ON s_from.source_system_claim_id = cl.source_system_claim_id
        AND cl.aca_source_system_id = src_sys.aca_source_system_id
        LEFT OUTER JOIN ALLIANT_CLAIMS_ASTRUS.DBO.ACA_CLAIMANT AS c ON s_from.source_system_claimant_id = c.source_system_claimant_id
        LEFT OUTER JOIN ALLIANT_CLAIMS_ASTRUS.DBO.ACA_POLICY AS p ON p.source_system_policy_id = s_from.source_system_policy_id
        LEFT OUTER JOIN ALLIANT_CLAIMS_ASTRUS.DBO.ACA_CLAIM_ATTRIBUTE AS ca ON s_from.source_system_claim_attribute_id = ca.source_system_claim_attribute_id
        LEFT OUTER JOIN ALLIANT_CLAIMS_ASTRUS.REF.ACA_ACCIDENT_SOURCE_CODE AS asco ON asco.source_system_accident_source_code_id = s_from.source_system_accident_source_code_id
        WHERE
            s.source_system_claim_id = s_from.source_system_claim_id AND s.source_system_transaction_date = s_from.source_system_transaction_date;
      END;
    testsEnabled: true
    truncateBefore: false
