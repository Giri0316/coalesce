name: DBSHIFT_PSTG_NODE
operation:
  config:
    insertStrategy: INSERT
    postSQL: ""
    preSQL: |-
      BEGIN
          -- This procedure is highly procedural, using cursors and dynamic SQL to perform
          -- backup, truncate, and status update operations on a list of tables defined in a control table.
          -- Such imperative logic is translated into a Snowflake Scripting block to be executed in its entirety.
          
          -- The iSourceGroupId parameter from the original procedure is hardcoded to 1 based on the provided test execution command.
          LET iSourceGroupId INT := 1;

          LET step VARCHAR(510);
          LET proc_name VARCHAR := 'dbo.spaca_aca_control_package_source_table_update';
          LET current_timestamp TIMESTAMP_NTZ := CURRENT_TIMESTAMP();
          LET sqlDropTable STRING;

          BEGIN
              step := 'Build SQL for Drop Unbacked Up Table(s)';

              SELECT LISTAGG(
                  'DROP TABLE IF EXISTS ' || DATABASE_NAME || '.' || SCHEMA_NAME || '.' || TABLE_NAME || BACKUP_TABLE_NAME_POSTFIX || ';',
                  '\n'
              )
              INTO :sqlDropTable
              FROM ALLIANT_CLAIMS_ASTRUS_STAGE.DBO.ACA_CONTROL_PACKAGE_SOURCE_TABLE
              WHERE BACKED_UP_FLAG = 0
              AND SOURCE_GROUP_ID = :iSourceGroupId;

              IF (:sqlDropTable IS NOT NULL AND :sqlDropTable != '') THEN
                  step := 'Drop Unbacked Up Table(s)';
                  EXECUTE IMMEDIATE :sqlDropTable;
              END IF;

              step := 'Processing tables for backup and truncate';
              
              -- Use a FOR loop, which is more idiomatic in Snowflake than a CURSOR.
              FOR row IN (
                  SELECT
                      ACA_CONTROL_PACKAGE_SOURCE_TABLE_ID,
                      DATABASE_NAME,
                      SCHEMA_NAME,
                      TABLE_NAME,
                      BACKUP_TABLE_NAME_POSTFIX
                  FROM ALLIANT_CLAIMS_ASTRUS_STAGE.DBO.ACA_CONTROL_PACKAGE_SOURCE_TABLE
                  WHERE BACKED_UP_FLAG = 0 AND SOURCE_GROUP_ID = :iSourceGroupId
              )
              DO
                  LET id INT := row.ACA_CONTROL_PACKAGE_SOURCE_TABLE_ID;
                  LET databaseName VARCHAR := row.DATABASE_NAME;
                  LET schemaName VARCHAR := row.SCHEMA_NAME;
                  LET tableName VARCHAR := row.TABLE_NAME;
                  LET backupPostfix VARCHAR := row.BACKUP_TABLE_NAME_POSTFIX;
                  LET backedupRecordCount INT := 0;
                  LET sqlInsert STRING;
                  LET sqlTruncate STRING;
                  LET object VARCHAR(512) := '(' || databaseName || '.' || schemaName || '.' || tableName || ')';

                  step := 'Start Transaction for object: ' || object;
                  BEGIN TRANSACTION;

                  step := 'Backup Table ' || object;
                  sqlInsert := 'CREATE OR REPLACE TABLE ' || databaseName || '.' || schemaName || '.' || tableName || backupPostfix || ' AS SELECT * FROM ' || databaseName || '.' || schemaName || '.' || tableName || ';';
                  EXECUTE IMMEDIATE :sqlInsert;
                  
                  backedupRecordCount := IFNULL(SQLROWCOUNT, 0);

                  step := 'Update Backup Status ' || object;
                  UPDATE ALLIANT_CLAIMS_ASTRUS_STAGE.DBO.ACA_CONTROL_PACKAGE_SOURCE_TABLE
                  SET BACKED_UP_FLAG = 1,
                      BACKED_UP_RECORD_COUNT = :backedupRecordCount,
                      ACA_DATE_UPDATED = :current_timestamp,
                      ACA_UPDATE_USER = :proc_name
                  WHERE ACA_CONTROL_PACKAGE_SOURCE_TABLE_ID = :id;

                  step := 'Truncate Source ' || object;
                  sqlTruncate := 'TRUNCATE TABLE IF EXISTS ' || databaseName || '.' || schemaName || '.' || tableName || ';';
                  EXECUTE IMMEDIATE :sqlTruncate;

                  step := 'Commit Transaction for object: ' || object;
                  COMMIT;

              END FOR;
              RETURN 'Success';
          EXCEPTION
              WHEN OTHER THEN
                  LET errmsg VARCHAR := 'Error: ' || SQLERRM || ' at step: ' || step;
                  ROLLBACK;
                  RAISE :errmsg;
          END;
      END;
