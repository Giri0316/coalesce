  config:
    insertStrategy: INSERT
    postSQL: ""
    preSQL: |-
      BEGIN
          USE DATABASE ALLIANT_CLAIMS_ASTRUS_STAGE;
      
          UPDATE
              ALLIANT_CLAIMS_ASTRUS_STAGE.DBO.ACA_CLAIM_STAGING_ESIS AS E
          SET
              ACA_SOURCE_SYSTEM_ID = SRC_SYSTEM.ACA_SOURCE_SYSTEM_ID,
              ACA_ACCOUNT_STRUCTURE_ID = IFNULL(AC.ACA_ACCOUNT_STRUCTURE_ID, -1),
              ACA_DATE_ID_CLAIM_DATE = IFNULL(TRY_TO_NUMBER(TO_VARCHAR(E.CLAIM_DATE, 'YYYYMMDD')), -1),
              ACA_DATE_ID_ORIGINAL_OPEN_DATE = IFNULL(TRY_TO_NUMBER(TO_VARCHAR(E.ORIGINAL_OPEN_DATE, 'YYYYMMDD')), -1),
              EMPLOYEE_IDENTIFICATION_NUMBER_ENCRYPTED = IFNULL(E.EMPLOYEE_IDENTIFICATION_NUMBER_ENCRYPTED, ENCRYPT(TO_BINARY(CAST(E.EMPLOYEE_IDENTIFICATION_NUMBER AS VARCHAR)), 'SymmetricKey1')),
              EMPLOYER_FEDERAL_TAX_IDENTIFICATION_NUMBER_ENCRYPTED = IFNULL(E.EMPLOYER_FEDERAL_TAX_IDENTIFICATION_NUMBER_ENCRYPTED, ENCRYPT(TO_BINARY(CAST(E.EMPLOYER_FEDERAL_TAX_IDENTIFICATION_NUMBER AS VARCHAR)), 'SymmetricKey1')),
              DEATH_DATE_ENCRYPTED = IFNULL(E.DEATH_DATE_ENCRYPTED, ENCRYPT(TO_BINARY(CAST(E.DEATH_DATE AS VARCHAR(25))), 'SymmetricKey1')),
              EMPLOYEE_IDENTIFICATION_NUMBER = NULL,
              EMPLOYER_FEDERAL_TAX_IDENTIFICATION_NUMBER = NULL,
              DEATH_DATE = NULL,
              ACA_DATE_UPDATED = CURRENT_TIMESTAMP(),
              ACA_UPDATE_USER = 'spaca_aca_claim_staging_esis_update'
          FROM (
              SELECT ACA_SOURCE_SYSTEM_ID FROM ALLIANT_CLAIMS_ASTRUS.DBO.ACA_SOURCE_SYSTEM WHERE SOURCE_SYSTEM = 'ESIS'
          ) AS SRC_SYSTEM
          LEFT JOIN ALLIANT_CLAIMS_ASTRUS.DBO.ACA_ACCOUNT_STRUCTURE AC
              ON E.SOURCE_SYSTEM_ACCOUNT_STRUCTURE_ID = AC.SOURCE_SYSTEM_ACCOUNT_STRUCTURE_ID
              AND AC.ACA_SOURCE_SYSTEM_ID = SRC_SYSTEM.ACA_SOURCE_SYSTEM_ID;
      END;
    testsEnabled: true
    truncateBefore: false
