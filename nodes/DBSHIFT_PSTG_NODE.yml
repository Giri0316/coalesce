    postSQL: ""
    preSQL: |-
      BEGIN
      USE DATABASE ALLIANT_CLAIMS_ASTRUS;
      UPDATE ALLIANT_CLAIMS_ASTRUS.DBO.ACA_EXPERIENCE_TRANSACTION p
      SET
          p.ACA_CLAIM_ID = source.new_aca_claim_id,
          p.ACA_DATE_UPDATED = CURRENT_TIMESTAMP(),
          p.ACA_UPDATE_USER = 'spaca_aca_experience_transaction_update'
      FROM (
          SELECT
              c.ACA_CLAIM_ID AS new_aca_claim_id,
              p.SOURCE_SYSTEM_CLAIM_ID
          FROM
              ALLIANT_CLAIMS_ASTRUS.DBO.ACA_EXPERIENCE_TRANSACTION AS P
          INNER JOIN
              ALLIANT_CLAIMS_ASTRUS.DBO.ACA_CLAIM AS C ON C.SOURCE_SYSTEM_CLAIM_ID = P.SOURCE_SYSTEM_CLAIM_ID
          WHERE
              P.ACA_CLAIM_ID = -1 AND P.SOURCE_SYSTEM_CLAIM_ID IS NOT NULL
      ) AS source
      WHERE p.SOURCE_SYSTEM_CLAIM_ID = source.SOURCE_SYSTEM_CLAIM_ID;
      END;
