  config:
    insertStrategy: INSERT
    postSQL: ""
    preSQL: |-
      USE DATABASE ALLIANT_CLAIMS_ASTRUS;
      BEGIN
          -- Check if there are any transactions to delete based on the original procedure's logic
          LET row_count INT := (
              SELECT COUNT(1)
              FROM ALLIANT_CLAIMS_ASTRUS.DBO.ACA_TRANSACTION_HEADER AS th
              INNER JOIN ALLIANT_CLAIMS_ASTRUS_STAGE.DBO.ACA_TRANSACTION_HEADER_STAGING AS ths 
                  ON th.ACTIVITY_FROM_DATE = ths.ACTIVITY_FROM_DATE
          );

          IF (row_count > 0) THEN
              -- delete rows from dbo.aca_transaction_header
              DELETE FROM ALLIANT_CLAIMS_ASTRUS.DBO.ACA_TRANSACTION_HEADER AS th
              USING ALLIANT_CLAIMS_ASTRUS_STAGE.DBO.ACA_TRANSACTION_HEADER_STAGING AS ths
              WHERE th.ACTIVITY_FROM_DATE = ths.ACTIVITY_FROM_DATE;

              -- delete rows from dbo.aca_transaction_claim
              DELETE FROM ALLIANT_CLAIMS_ASTRUS.DBO.ACA_TRANSACTION_CLAIM AS tc
              USING ALLIANT_CLAIMS_ASTRUS_STAGE.DBO.ACA_TRANSACTION_HEADER_STAGING AS ths
              WHERE tc.TRANSACTION_DATE = ths.ACTIVITY_FROM_DATE;

              -- delete rows from dbo.aca_transaction_excess	
              DELETE FROM ALLIANT_CLAIMS_ASTRUS.DBO.ACA_TRANSACTION_EXCESS AS te
              USING ALLIANT_CLAIMS_ASTRUS_STAGE.DBO.ACA_TRANSACTION_HEADER_STAGING AS ths
              WHERE te.EXCESS_TRANSACTION_DATE = ths.ACTIVITY_FROM_DATE;

              -- delete rows from dbo.aca_transaction_experience
              DELETE FROM ALLIANT_CLAIMS_ASTRUS.DBO.ACA_TRANSACTION_EXPERIENCE AS te
              USING ALLIANT_CLAIMS_ASTRUS_STAGE.DBO.ACA_TRANSACTION_HEADER_STAGING AS ths
              WHERE te.EXPERIENCE_TRANSACTION_DATE = ths.ACTIVITY_FROM_DATE;

              -- delete rows from dbo.aca_transaction_payment
              DELETE FROM ALLIANT_CLAIMS_ASTRUS.DBO.ACA_TRANSACTION_PAYMENT AS tp
              USING ALLIANT_CLAIMS_ASTRUS_STAGE.DBO.ACA_TRANSACTION_HEADER_STAGING AS ths
              WHERE tp.PAYMENT_TRANSACTION_DATE = ths.ACTIVITY_FROM_DATE;

              -- delete rows from aca_transaction_third_party_recovery
              DELETE FROM ALLIANT_CLAIMS_ASTRUS.DBO.ACA_TRANSACTION_THIRD_PARTY_RECOVERY AS ttpr
              USING ALLIANT_CLAIMS_ASTRUS_STAGE.DBO.ACA_TRANSACTION_HEADER_STAGING AS ths
              WHERE ttpr.THIRD_PARTY_RECOVERY_TRANSACTION_DATE = ths.ACTIVITY_FROM_DATE;
          END IF;
      END;
