operation:
  config:
    insertStrategy: INSERT
    postSQL: ""
    preSQL: |-
      BEGIN
        USE DATABASE ALLIANT_CLAIMS_ASTRUS_STAGE;
      
        UPDATE DBO.ACA_RECOVERY_TRANSACTION_STAGING_GB AS R
        SET R.ACA_CLAIM_ID = SOURCE.NEW_ACA_CLAIM_ID,
            R.ACA_POLICY_ID = SOURCE.NEW_ACA_POLICY_ID,
            R.ACA_DATE_UPDATED = SOURCE.NEW_ACA_DATE_UPDATED,
            R.ACA_UPDATE_USER = SOURCE.NEW_ACA_UPDATE_USER
        FROM (
            SELECT
                R_INNER.SOURCE_SYSTEM_CLAIM_ID AS JOIN_KEY_1,
                R_INNER.SOURCE_SYSTEM_POLICY_ID AS JOIN_KEY_2,
                COALESCE(C.ACA_CLAIM_ID, -1) AS NEW_ACA_CLAIM_ID,
                COALESCE(PO.ACA_POLICY_ID, -1) AS NEW_ACA_POLICY_ID,
                CURRENT_TIMESTAMP() AS NEW_ACA_DATE_UPDATED,
                'spaca_aca_recovery_transaction_staging_gb_update' AS NEW_ACA_UPDATE_USER
            FROM DBO.ACA_RECOVERY_TRANSACTION_STAGING_GB AS R_INNER
            LEFT JOIN ALLIANT_CLAIMS_ASTRUS.DBO.ACA_CLAIM AS C
                ON C.SOURCE_SYSTEM_CLAIM_ID = R_INNER.SOURCE_SYSTEM_CLAIM_ID
            LEFT JOIN ALLIANT_CLAIMS_ASTRUS.DBO.ACA_POLICY AS PO
                ON PO.SOURCE_SYSTEM_POLICY_ID = R_INNER.SOURCE_SYSTEM_POLICY_ID
        ) AS SOURCE
        WHERE R.SOURCE_SYSTEM_CLAIM_ID = SOURCE.JOIN_KEY_1
          AND R.SOURCE_SYSTEM_POLICY_ID = SOURCE.JOIN_KEY_2;
      
      END;
    testsEnabled: true
    truncateBefore: false
