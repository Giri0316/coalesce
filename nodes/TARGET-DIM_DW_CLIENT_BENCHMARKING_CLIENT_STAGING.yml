name: DIM_DW_CLIENT_BENCHMARKING_CLIENT_STAGING
operation:
  config:
    postSQL: |
      /* Soft delete — Snowflake-compatible */
      UPDATE "ALLIANT_DW_STAGE"."DBO"."DIM_DW_CLIENT_BENCHMARKING_CLIENT_STAGING" AS TGT
      SET
        "DW_DATE_DELETED" = CURRENT_TIMESTAMP(),
        "dw_date_updated" = CURRENT_TIMESTAMP(),
        "dw_update_user" = 'DELETED_BY_POC'
      WHERE "DW_DATE_DELETED" IS NULL
        AND NOT EXISTS (
          SELECT 1
          FROM "ALLIANT_DW_STAGE"."DBO"."STG_DW_CLIENT_BENCHMARKING_CLIENT_STAGING" AS SRC
          WHERE SRC."SOURCE_SYSTEM_CLIENT_ID" = TGT."SOURCE_SYSTEM_CLIENT_ID"
            AND SRC."SOURCE_SYSTEM_POLICY_LINE_ID" = TGT."SOURCE_SYSTEM_POLICY_LINE_ID"
        );
    preSQL: |
      BEGIN
        ALTER TABLE "ALLIANT_DW_STAGE"."DBO"."DIM_DW_CLIENT_BENCHMARKING_CLIENT_STAGING" 
        ADD COLUMN IF NOT EXISTS "DW_DATE_DELETED" TIMESTAMP_NTZ NULL;

      END;
