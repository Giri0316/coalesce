    sourceMapping:
      - aliases:
          TMP: TMP
        customSQL:
          customSQL: ''
        dependencies:
          - locationName: PLANNING_ALLIANT_DBO
            nodeName: PLANNING_FCCS_ACTUALS_STAGING
          - locationName: PLANNING_ALLIANT_DBO
            nodeName: PLANNING_FCCS_CLIENT
        join:
          joinCondition: "FROM (\n  WITH INITIAL_DATA AS (\n      SELECT\n       \
            \   B.PARENT_PLANNING_ID AS BASE_PARENT_PLANNING_ID,\n          STG.CLIENT_PLANNING_ID\
            \ AS PLANNING_ID,\n          STG.CLIENT_NAME,\n          STG.CLIENT_LOOKUP_CODE,\n\
            \          STG.CLIENT_STATUS_INDICATOR,\n          STG.CLIENT_ALIAS AS\
            \ PLANNING_ALIAS,\n          STG.SOURCE_SYSTEM,\n          STG.DW_CLIENT_MASTER_ID,\n\
            \          REPLACE(IFF(LEFT(STG.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE, 1) =\
            \ '-', SUBSTRING(STG.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE, 2, LEN(STG.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE)),\
            \ STG.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE), '*', '') AS SOURCE_SYSTEM_CLIENT_LOOKUP_CODE,\n\
            \          STG.SOURCE_SYSTEM_CLIENT_ID,\n          STG.DW_SOURCE_SYSTEM_ID,\n\
            \          ROW_NUMBER() OVER(ORDER BY STG.SOURCE_SYSTEM, STG.DW_CLIENT_MASTER_ID)\
            \ AS ROW_ID,\n          TRY_CAST(SUBSTRING(B.PARENT_PLANNING_ID,1, POSITION('_'\
            \ IN B.PARENT_PLANNING_ID)-1) AS INT) AS GROUP_ID,\n          B.PARENT_PLANNING_ID\
            \ AS GROUP_NAME,\n          MIN(STG.POST_DATE) AS BEGIN_POST_DATE,\n \
            \         MAX(STG.POST_DATE) AS END_POST_DATE\n      FROM {{ ref('PLANNING_ALLIANT_DBO',\
            \ 'PLANNING_FCCS_ACTUALS_STAGING') }} AS STG\n      LEFT OUTER JOIN {{\
            \ ref('PLANNING_ALLIANT_DBO', 'PLANNING_FCCS_CLIENT') }} AS B ON STG.CLIENT_PLANNING_ID\
            \ = B.PLANNING_ID\n      WHERE STG.CLIENT_PLANNING_ID <> 'No_Client'\n\
            \        AND IFFNULL(STG.THRESHOLD_RULE_TYPE, '-1') NOT IN ('Threshold\
            \ Client','Threshold Structure')\n      GROUP BY B.PARENT_PLANNING_ID,\
            \ STG.CLIENT_PLANNING_ID, STG.CLIENT_NAME, STG.CLIENT_LOOKUP_CODE, STG.CLIENT_STATUS_INDICATOR,\
            \ STG.CLIENT_ALIAS, STG.SOURCE_SYSTEM, STG.DW_CLIENT_MASTER_ID, REPLACE(IFF(LEFT(STG.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE,\
            \ 1) = '-', SUBSTRING(STG.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE, 2, LEN(STG.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE)),\
            \ STG.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE), '*', ''), STG.SOURCE_SYSTEM_CLIENT_ID,\
            \ STG.DW_SOURCE_SYSTEM_ID, TRY_CAST(SUBSTRING(B.PARENT_PLANNING_ID,1,\
            \ POSITION('_' IN B.PARENT_PLANNING_ID)-1) AS INT)\n  ),\n  GROUP_VARS\
            \ AS (\n      SELECT\n          MAX(TRY_CAST(SUBSTRING(PARENT_PLANNING_ID,1,\
            \ POSITION('_' IN PARENT_PLANNING_ID)-1) AS INT)) AS MAX_GROUP_ID,\n \
            \         (SELECT COUNT(1) FROM {{ ref('PLANNING_ALLIANT_DBO', 'PLANNING_FCCS_CLIENT')\
            \ }} WHERE TRY_CAST(SUBSTRING(PARENT_PLANNING_ID,1, POSITION('_' IN PARENT_PLANNING_ID)-1)\
            \ AS INT) = MAX_GROUP_ID) AS COUNT_OF_MAX_GROUP_ID\n      FROM {{ ref('PLANNING_ALLIANT_DBO',\
            \ 'PLANNING_FCCS_CLIENT') }}\n  ),\n  RANKED_NULLS AS (\n      SELECT\
            \ *, ROW_NUMBER() OVER (ORDER BY ROW_ID) AS RN_FOR_NULLS\n      FROM INITIAL_DATA\n\
            \      WHERE GROUP_ID IS NULL\n  ),\n  FINAL_CALCS AS (\n      SELECT\n\
            \          D.BASE_PARENT_PLANNING_ID, D.PLANNING_ID, D.CLIENT_NAME, D.CLIENT_LOOKUP_CODE,\
            \ D.CLIENT_STATUS_INDICATOR, D.PLANNING_ALIAS, D.SOURCE_SYSTEM, D.DW_CLIENT_MASTER_ID,\
            \ D.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE, D.SOURCE_SYSTEM_CLIENT_ID, D.DW_SOURCE_SYSTEM_ID,\
            \ D.ROW_ID, D.BEGIN_POST_DATE, D.END_POST_DATE,\n          COALESCE(\n\
            \              D.GROUP_ID,\n              CASE\n                  WHEN\
            \ GV.MAX_GROUP_ID IS NOT NULL AND R.RN_FOR_NULLS <= (300.00 - GV.COUNT_OF_MAX_GROUP_ID)\n\
            \                  THEN GV.MAX_GROUP_ID\n                  ELSE\n    \
            \                  (IFFNULL(GV.MAX_GROUP_ID, 0) + 1) + FLOOR((R.RN_FOR_NULLS\
            \ - IFF(GV.COUNT_OF_MAX_GROUP_ID >= 300, 0, (300.00 - GV.COUNT_OF_MAX_GROUP_ID))\
            \ - 1) / 300.00)\n              END\n          ) AS FINAL_GROUP_ID\n \
            \     FROM INITIAL_DATA AS D\n      LEFT JOIN RANKED_NULLS AS R ON D.ROW_ID\
            \ = R.ROW_ID\n      CROSS JOIN GROUP_VARS AS GV\n  )\n  SELECT\n     \
            \ COALESCE(FC.BASE_PARENT_PLANNING_ID, CONCAT(FC.FINAL_GROUP_ID, '_Client_Parent'))\
            \ AS PARENT_PLANNING_ID,\n      FC.PLANNING_ID,\n      FC.CLIENT_NAME,\n\
            \      FC.CLIENT_LOOKUP_CODE,\n      FC.CLIENT_STATUS_INDICATOR,\n   \
            \   FC.PLANNING_ALIAS,\n      FC.SOURCE_SYSTEM,\n      FC.DW_CLIENT_MASTER_ID,\n\
            \      FC.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE,\n      FC.SOURCE_SYSTEM_CLIENT_ID,\n\
            \      FC.DW_SOURCE_SYSTEM_ID,\n      FC.ROW_ID,\n      FC.FINAL_GROUP_ID\
            \ AS GROUP_ID,\n      COALESCE(FC.BASE_PARENT_PLANNING_ID, CONCAT(FC.FINAL_GROUP_ID,\
            \ '_Client_Parent')) AS GROUP_NAME,\n      FC.BEGIN_POST_DATE,\n     \
            \ FC.END_POST_DATE\n  FROM FINAL_CALCS AS FC\n) AS TMP"
        name: TMP_NEW_PLANNING_CLIENT
        noLinkRefs: []
  overrideSQL: false
  schema: ''
  sqlType: Stage
  version: 1
