name: ACA_CLAIM_ATTRIBUTE
operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      UPDATE ALLIANT_CLAIMS_ASTRUS.DBO.ACA_CLAIM_ATTRIBUTE ca
      SET 
          ca.CLAIM_STATUS_DESCRIPTION = st.CLAIM_STATUS_DESCRIPTION,
          ca.DEATH_RESULT_DESCRIPTION = st.DEATH_RESULT_DESCRIPTION,
          ca.REPORTING_BASIS_DESCRIPTION = st.REPORTING_BASIS_DESCRIPTION,
          ca.CLAIMANT_TYPE = st.CLAIMANT_TYPE,
          ca.WORKERS_COMPENSATION_CLAIM_TYPE = st.WORKERS_COMPENSATION_CLAIM_TYPE,
          ca.DEGREE_OF_LOSS_DESCRIPTION = st.DEGREE_OF_LOSS_DESCRIPTION,
          ca.APPRAISED_ELIGIBILITY_DESCRIPTION = st.APPRAISED_ELIGIBILITY_DESCRIPTION,
          ca.ACA_DATE_UPDATED = CURRENT_TIMESTAMP(),
          ca.ACA_UPDATE_USER = 'dbo.spaca_aca_claim_attribute_insertUpdate'
      FROM ALLIANT_CLAIMS_ASTRUS_STAGE.DBO.ACA_CLAIM_ATTRIBUTE_STAGING st
      WHERE st.SOURCE_SYSTEM_CLAIM_ATTRIBUTE_ID = ca.SOURCE_SYSTEM_CLAIM_ATTRIBUTE_ID
        AND ca.ACA_DATE_CREATED <> CURRENT_TIMESTAMP()
        AND (
            COALESCE(ca.DEATH_RESULT_DESCRIPTION, '') <> COALESCE(st.DEATH_RESULT_DESCRIPTION, '')
            OR COALESCE(ca.REPORTING_BASIS_DESCRIPTION, '') <> COALESCE(st.REPORTING_BASIS_DESCRIPTION, '')
            OR COALESCE(ca.CLAIMANT_TYPE, '') <> COALESCE(st.CLAIMANT_TYPE, '')
            OR COALESCE(ca.WORKERS_COMPENSATION_CLAIM_TYPE, '') <> COALESCE(st.WORKERS_COMPENSATION_CLAIM_TYPE, '')
            OR COALESCE(ca.DEGREE_OF_LOSS_DESCRIPTION, '') <> COALESCE(st.DEGREE_OF_LOSS_DESCRIPTION, '')
            OR COALESCE(ca.APPRAISED_ELIGIBILITY_DESCRIPTION, '') <> COALESCE(st.APPRAISED_ELIGIBILITY_DESCRIPTION, '')
        )
    preSQL: ""
    testsEnabled: true
    truncateBefore: false
