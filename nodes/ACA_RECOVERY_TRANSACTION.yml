operation:
  config:
    insertStrategy: INSERT
    postSQL: ""
    preSQL: |-
      BEGIN
          DELETE FROM ALLIANT_CLAIMS_ASTRUS.DBO.ACA_RECOVERY_TRANSACTION
          WHERE ACA_SOURCE_SYSTEM_ID = (SELECT ACA_SOURCE_SYSTEM_ID FROM {{ ref('DBSHIFT', 'ACA_SOURCE_SYSTEM') }} WHERE SOURCE_SYSTEM = 'GB')
          AND RECOVERY_TRANSACTION_DATE IN (SELECT RECOVERY_TRANSACTION_DATE
                                            FROM {{ ref('DBSHIFT', 'ACA_RECOVERY_TRANSACTION_STAGING_GB') }}
                                            GROUP BY RECOVERY_TRANSACTION_DATE);
      
          DELETE FROM ALLIANT_CLAIMS_ASTRUS.DBO.ACA_RECOVERY_TRANSACTION
          WHERE ACA_SOURCE_SYSTEM_ID = (SELECT ACA_SOURCE_SYSTEM_ID FROM {{ ref('DBSHIFT', 'ACA_SOURCE_SYSTEM') }} WHERE SOURCE_SYSTEM = 'ESIS')
          AND RECOVERY_TRANSACTION_DATE IN (SELECT RECOVERY_TRANSACTION_DATE
                                            FROM {{ ref('DBSHIFT', 'ACA_RECOVERY_TRANSACTION_STAGING_ESIS') }}
                                            GROUP BY RECOVERY_TRANSACTION_DATE);
      END;
    testsEnabled: true
    truncateBefore: false
