          - locationName: PLANNING_ALLIANT_DBO
            nodeName: PLANNING_FCCS_BROKER
          - locationName: PLANNING_ALLIANT_DBO
            nodeName: PLANNING_FCCS_ACTUALS_STAGING
        join:
          joinCondition: 'FROM {{ ref(''PLANNING_ALLIANT_DBO'', ''PLANNING_FCCS_BROKER'')
            }}

            LEFT JOIN {{ ref(''PLANNING_ALLIANT_DBO'', ''PLANNING_FCCS_ACTUALS_STAGING'')
            }} ON 1=0'
