        dependencies:
          - locationName: DBSHIFT
            nodeName: DW_CLIENT_BENCHMARKING_CLIENT_POLICY_STAGING_EPIC_FORM_MAP
          - locationName: DBSHIFT
            nodeName: STG_SCREENDATA
        join:
          joinCondition: |
            FROM (
                SELECT
                    sd.UNIQENTITY,
                    sd.UNIQPOLICY,
                    sd.UNIQLINE,
                    sd.POLICYNUMBER,
                    sd.CDPOLICYLINETYPECODE,
                    m.FIELD_NAME,
                    sd.FIELD_DATA
                FROM {{ ref('DBSHIFT', 'STG_SCREENDATA') }} AS sd
                INNER JOIN {{ ref('DBSHIFT', 'DW_CLIENT_BENCHMARKING_CLIENT_POLICY_STAGING_EPIC_FORM_MAP') }} AS m
                    ON sd.FIELD_ID = m.FIELD_ID
                    AND sd.UNIQCUSTOMFORMMAP = m.UNIQCUSTOMFORMMAP
                WHERE m.PAGE_DESCRIPTION = 'Coverage Type/Limits/Retention'
            )
            PIVOT (
                MAX(FIELD_DATA)
                FOR FIELD_NAME IN ('AggrLimit', 'EaClaimLimit', 'ExcessLayerLimit', 'Retention')
            ) AS pvt (UNIQENTITY, UNIQPOLICY, UNIQLINE, POLICYNUMBER, CDPOLICYLINETYPECODE, AGGRLIMIT, EACLAIMLIMIT, EXCESSLAYERLIMIT, RETENTION)
