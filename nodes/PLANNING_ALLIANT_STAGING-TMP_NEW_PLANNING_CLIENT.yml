    sourceMapping:
      - aliases:
          TMP: TMP
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: PLANNING_ALLIANT_DBO
            nodeName: PLANNING_FCCS_ACTUALS_STAGING
          - locationName: PLANNING_ALLIANT_DBO
            nodeName: PLANNING_FCCS_CLIENT
        join:
          joinCondition: |-
            FROM (
              WITH INITIAL_DATA AS (
                  SELECT
                      B.PARENT_PLANNING_ID AS BASE_PARENT_PLANNING_ID,
                      STG.CLIENT_PLANNING_ID AS PLANNING_ID,
                      STG.CLIENT_NAME,
                      STG.CLIENT_LOOKUP_CODE,
                      STG.CLIENT_STATUS_INDICATOR,
                      STG.CLIENT_ALIAS AS PLANNING_ALIAS,
                      STG.SOURCE_SYSTEM,
                      STG.DW_CLIENT_MASTER_ID,
                      REPLACE(IFF(LEFT(STG.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE, 1) = '-', SUBSTRING(STG.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE, 2, LEN(STG.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE)), STG.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE), '*', '') AS SOURCE_SYSTEM_CLIENT_LOOKUP_CODE,
                      STG.SOURCE_SYSTEM_CLIENT_ID,
                      STG.DW_SOURCE_SYSTEM_ID,
                      ROW_NUMBER() OVER(ORDER BY STG.SOURCE_SYSTEM, STG.DW_CLIENT_MASTER_ID) AS ROW_ID,
                      TRY_CAST(SUBSTRING(B.PARENT_PLANNING_ID,1, POSITION('_' IN B.PARENT_PLANNING_ID)-1) AS INT) AS GROUP_ID,
                      B.PARENT_PLANNING_ID AS GROUP_NAME,
                      MIN(STG.POST_DATE) AS BEGIN_POST_DATE,
                      MAX(STG.POST_DATE) AS END_POST_DATE
                  FROM {{ ref('PLANNING_ALLIANT_DBO', 'PLANNING_FCCS_ACTUALS_STAGING') }} AS STG
                  LEFT OUTER JOIN {{ ref('PLANNING_ALLIANT_DBO', 'PLANNING_FCCS_CLIENT') }} AS B ON STG.CLIENT_PLANNING_ID = B.PLANNING_ID
                  WHERE STG.CLIENT_PLANNING_ID <> 'No_Client'
                    AND IFFNULL(STG.THRESHOLD_RULE_TYPE, '-1') NOT IN ('Threshold Client','Threshold Structure')
                  GROUP BY B.PARENT_PLANNING_ID, STG.CLIENT_PLANNING_ID, STG.CLIENT_NAME, STG.CLIENT_LOOKUP_CODE, STG.CLIENT_STATUS_INDICATOR, STG.CLIENT_ALIAS, STG.SOURCE_SYSTEM, STG.DW_CLIENT_MASTER_ID, REPLACE(IFF(LEFT(STG.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE, 1) = '-', SUBSTRING(STG.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE, 2, LEN(STG.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE)), STG.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE), '*', ''), STG.SOURCE_SYSTEM_CLIENT_ID, STG.DW_SOURCE_SYSTEM_ID, TRY_CAST(SUBSTRING(B.PARENT_PLANNING_ID,1, POSITION('_' IN B.PARENT_PLANNING_ID)-1) AS INT)
              ),
              GROUP_VARS AS (
                  SELECT
                      MAX(TRY_CAST(SUBSTRING(PARENT_PLANNING_ID,1, POSITION('_' IN PARENT_PLANNING_ID)-1) AS INT)) AS MAX_GROUP_ID,
                      (SELECT COUNT(1) FROM {{ ref('PLANNING_ALLIANT_DBO', 'PLANNING_FCCS_CLIENT') }} WHERE TRY_CAST(SUBSTRING(PARENT_PLANNING_ID,1, POSITION('_' IN PARENT_PLANNING_ID)-1) AS INT) = MAX_GROUP_ID) AS COUNT_OF_MAX_GROUP_ID
                  FROM {{ ref('PLANNING_ALLIANT_DBO', 'PLANNING_FCCS_CLIENT') }}
              ),
              RANKED_NULLS AS (
                  SELECT *, ROW_NUMBER() OVER (ORDER BY ROW_ID) AS RN_FOR_NULLS
                  FROM INITIAL_DATA
                  WHERE GROUP_ID IS NULL
              ),
              FINAL_CALCS AS (
                  SELECT
                      D.BASE_PARENT_PLANNING_ID, D.PLANNING_ID, D.CLIENT_NAME, D.CLIENT_LOOKUP_CODE, D.CLIENT_STATUS_INDICATOR, D.PLANNING_ALIAS, D.SOURCE_SYSTEM, D.DW_CLIENT_MASTER_ID, D.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE, D.SOURCE_SYSTEM_CLIENT_ID, D.DW_SOURCE_SYSTEM_ID, D.ROW_ID, D.BEGIN_POST_DATE, D.END_POST_DATE,
                      COALESCE(
                          D.GROUP_ID,
                          CASE
                              WHEN GV.MAX_GROUP_ID IS NOT NULL AND R.RN_FOR_NULLS <= (300.00 - GV.COUNT_OF_MAX_GROUP_ID)
                              THEN GV.MAX_GROUP_ID
                              ELSE
                                  (IFFNULL(GV.MAX_GROUP_ID, 0) + 1) + FLOOR((R.RN_FOR_NULLS - IFF(GV.COUNT_OF_MAX_GROUP_ID >= 300, 0, (300.00 - GV.COUNT_OF_MAX_GROUP_ID)) - 1) / 300.00)
                          END
                      ) AS FINAL_GROUP_ID
                  FROM INITIAL_DATA AS D
                  LEFT JOIN RANKED_NULLS AS R ON D.ROW_ID = R.ROW_ID
                  CROSS JOIN GROUP_VARS AS GV
              )
              SELECT
                  COALESCE(FC.BASE_PARENT_PLANNING_ID, CONCAT(FC.FINAL_GROUP_ID, '_Client_Parent')) AS PARENT_PLANNING_ID,
                  FC.PLANNING_ID,
                  FC.CLIENT_NAME,
                  FC.CLIENT_LOOKUP_CODE,
                  FC.CLIENT_STATUS_INDICATOR,
                  FC.PLANNING_ALIAS,
                  FC.SOURCE_SYSTEM,
                  FC.DW_CLIENT_MASTER_ID,
                  FC.SOURCE_SYSTEM_CLIENT_LOOKUP_CODE,
                  FC.SOURCE_SYSTEM_CLIENT_ID,
                  FC.DW_SOURCE_SYSTEM_ID,
                  FC.ROW_ID,
                  FC.FINAL_GROUP_ID AS GROUP_ID,
                  COALESCE(FC.BASE_PARENT_PLANNING_ID, CONCAT(FC.FINAL_GROUP_ID, '_Client_Parent')) AS GROUP_NAME,
                  FC.BEGIN_POST_DATE,
                  FC.END_POST_DATE
              FROM FINAL_CALCS AS FC
            ) AS TMP
        name: TMP_NEW_PLANNING_CLIENT
        noLinkRefs: []
