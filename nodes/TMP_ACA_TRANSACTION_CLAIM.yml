        join:
          joinCondition: |-
            FROM {{ ref('ALLIANT_CLAIMS_ASTRUS_DBO', 'ACA_TRANSACTION_CLAIM') }} AS ATC
            INNER JOIN (
                SELECT 
                    ACA_TRANSACTION_CLAIM_ID,
                    ROW_NUMBER() OVER (PARTITION BY UNIQUE_CLAIM_ID ORDER BY TRANSACTION_DATE DESC, STATUS_DATE DESC, ACA_TRANSACTION_CLAIM_ID DESC) AS ROW_NUM_SEQ
                FROM {{ ref('ALLIANT_CLAIMS_ASTRUS_DBO', 'ACA_TRANSACTION_CLAIM') }}
                WHERE ACA_DATE_UPDATED > (
                    SELECT IFNULL(MAX(ACA_DATE_UPDATED), '1776-07-04 00:00:00.000'::TIMESTAMP_NTZ) 
                    FROM {{ ref('ALLIANT_CLAIMS_ASTRUS_DBO', 'ACA_CLAIM') }} 
                    WHERE ACA_SOURCE_SYSTEM_ID = (SELECT ACA_SOURCE_SYSTEM_ID FROM {{ ref('ALLIANT_CLAIMS_ASTRUS_DBO', 'ACA_SOURCE_SYSTEM') }} WHERE SOURCE_SYSTEM = 'GB')
                ) AND TRANSACTION_DATE > (
                    SELECT TRANSACTION_DATE 
                    FROM {{ ref('ALLIANT_CLAIMS_ASTRUS_DBO', 'V_ACA_TRANSACTION_DATE_CURRENT') }} 
                    WHERE ACA_SOURCE_SYSTEM_ID = (SELECT ACA_SOURCE_SYSTEM_ID FROM {{ ref('ALLIANT_CLAIMS_ASTRUS_DBO', 'ACA_SOURCE_SYSTEM') }} WHERE SOURCE_SYSTEM = 'GB')
                )
            ) AS ATC_RNUM ON ATC.ACA_TRANSACTION_CLAIM_ID = ATC_RNUM.ACA_TRANSACTION_CLAIM_ID
            WHERE ATC_RNUM.ROW_NUM_SEQ = 1
