operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      BEGIN 

          IF ((SELECT DISTINCT max_group_id FROM {{ ref('DBSHIFT', 'STG_PLANNING_FCCS_ACTUALS_STAGING_PLANNING_FCCS_BROKER') }}) IS NOT NULL) THEN 
              UPDATE {{ ref('DBSHIFT', 'STG_PLANNING_FCCS_ACTUALS_STAGING_PLANNING_FCCS_BROKER') }} 
              SET 
                  group_id = (SELECT DISTINCT max_group_id FROM "ALLIANT_DB"."DBO"."STG_PLANNING_FCCS_ACTUALS_STAGING_PLANNING_FCCS_BROKER"), 
                  group_name = CONCAT((SELECT DISTINCT max_group_id FROM "ALLIANT_DB"."DBO"."STG_PLANNING_FCCS_ACTUALS_STAGING_PLANNING_FCCS_BROKER"), '_Producer_Parent'), 
                  parent_planning_id = CONCAT((SELECT DISTINCT max_group_id FROM "ALLIANT_DB"."DBO"."STG_PLANNING_FCCS_ACTUALS_STAGING_PLANNING_FCCS_BROKER"), '_Producer_Parent') 
              WHERE group_id IS NULL 
                AND dw_source_system_id <= ((SELECT DISTINCT no_rows FROM "ALLIANT_DB"."DBO"."STG_PLANNING_FCCS_ACTUALS_STAGING_PLANNING_FCCS_BROKER") - (SELECT DISTINCT count_of_max_group_id FROM "ALLIANT_DB"."DBO"."STG_PLANNING_FCCS_ACTUALS_STAGING_PLANNING_FCCS_BROKER"));

          END IF;

      END;
