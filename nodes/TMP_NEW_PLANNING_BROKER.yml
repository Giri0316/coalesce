operation:
  name: TMP_NEW_PLANNING_BROKER
  type: sql
  config:
    insertStrategy: INSERT
    postSQL: "BEGIN\n    LET MAX_GROUP_ID_VAL NUMBER := (SELECT DISTINCT MAX_GROUP_ID\
      \ FROM {{ ref_no_link('PLANNING_ALLIANT_DBO', 'TMP_NEW_PLANNING_BROKER') }});\n\
      \    LET COUNT_OF_MAX_GROUP_ID_VAL NUMBER := (SELECT DISTINCT COUNT_OF_MAX_GROUP_ID\
      \ FROM {{ ref_no_link('PLANNING_ALLIANT_DBO', 'TMP_NEW_PLANNING_BROKER') }});\n\
      \    LET NO_ROWS_VAL NUMBER(8,2) := (SELECT DISTINCT NO_ROWS FROM {{ ref_no_link('PLANNING_ALLIANT_DBO',\
      \ 'TMP_NEW_PLANNING_BROKER') }});\n\n    IF (MAX_GROUP_ID_VAL IS NOT NULL) THEN\n\
      \        UPDATE {{ ref_no_link('PLANNING_ALLIANT_DBO', 'TMP_NEW_PLANNING_BROKER')\
      \ }} AS T\n        SET\n            T.GROUP_ID = MAX_GROUP_ID_VAL,\n       \
      \     T.GROUP_NAME =  CONCAT(MAX_GROUP_ID_VAL, '_Producer_Parent'),\n      \
      \      T.PARENT_PLANNING_ID =  CONCAT(MAX_GROUP_ID_VAL, '_Producer_Parent')\n\
      \        FROM (\n            SELECT ROW_ID FROM {{ ref_no_link('PLANNING_ALLIANT_DBO',\
      \ 'TMP_NEW_PLANNING_BROKER') }} WHERE GROUP_ID IS NULL ORDER BY ROW_ID\n   \
      \         LIMIT (CAST(NO_ROWS_VAL AS INT) - COUNT_OF_MAX_GROUP_ID_VAL)\n   \
      \     ) AS S\n        WHERE T.ROW_ID = S.ROW_ID;\n    END IF;\n\n    UPDATE\
      \ {{ ref_no_link('PLANNING_ALLIANT_DBO', 'TMP_NEW_PLANNING_BROKER') }} AS T\n\
      \    SET\n        T.GROUP_ID = GRP.NEW_GROUP_ID,\n        T.GROUP_NAME = GRP.NEW_GROUP_ID\
      \ || '_Producer_Parent',\n        T.PARENT_PLANNING_ID = GRP.NEW_GROUP_ID ||\
      \ '_Producer_Parent'\n    FROM (\n        SELECT\n            ROW_ID,\n    \
      \        COALESCE((SELECT MAX(GROUP_ID) FROM {{ ref_no_link('PLANNING_ALLIANT_DBO',\
      \ 'TMP_NEW_PLANNING_BROKER') }} WHERE GROUP_ID IS NOT NULL), 0) + CEIL(ROW_NUMBER()\
      \ OVER (ORDER BY ROW_ID) / (NO_ROWS_VAL)::FLOAT) AS NEW_GROUP_ID\n        FROM\
      \ {{ ref_no_link('PLANNING_ALLIANT_DBO', 'TMP_NEW_PLANNING_BROKER') }}\n   \
      \     WHERE GROUP_ID IS NULL\n    ) AS GRP\n    WHERE T.ROW_ID = GRP.ROW_ID;\n\
      END;"
    preSQL: ''
    testsEnabled: true
    truncateBefore: true
