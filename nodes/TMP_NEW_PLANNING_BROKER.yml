operation:
  name: TMP_NEW_PLANNING_BROKER
  type: sql
  config:
    insertStrategy: INSERT
    postSQL: "BEGIN\n    LET NO_ROWS DECIMAL(8, 2) := 300.00;\n    LET MAX_GROUP_ID\
      \ INT;\n    LET COUNT_OF_MAX_GROUP_ID INT;\n\n    SELECT MAX(TRY_CAST(SUBSTRING(PARENT_PLANNING_ID,\
      \ 1, POSITION('_', PARENT_PLANNING_ID) - 1) AS INT))\n    INTO :MAX_GROUP_ID\n\
      \    FROM {{ ref_no_link('PLANNING_ALLIANT_DBO', 'PLANNING_FCCS_BROKER') }};\n\
      \n    IF (:MAX_GROUP_ID IS NOT NULL) THEN\n        SELECT COUNT(1)\n       \
      \ INTO :COUNT_OF_MAX_GROUP_ID\n        FROM {{ ref_no_link('PLANNING_ALLIANT_DBO',\
      \ 'PLANNING_FCCS_BROKER') }}\n        WHERE TRY_CAST(SUBSTRING(PARENT_PLANNING_ID,\
      \ 1, POSITION('_', PARENT_PLANNING_ID) - 1) AS INT) = :MAX_GROUP_ID;\n\n   \
      \     UPDATE {{ ref_no_link('PLANNING_ALLIANT_STAGING', 'TMP_NEW_PLANNING_BROKER')\
      \ }} AS T\n        SET\n            T.GROUP_ID = :MAX_GROUP_ID,\n          \
      \  T.GROUP_NAME = :MAX_GROUP_ID || '_Producer_Parent',\n            T.PARENT_PLANNING_ID\
      \ = :MAX_GROUP_ID || '_Producer_Parent'\n        FROM (\n            SELECT\
      \ ROW_ID, ROW_NUMBER() OVER (ORDER BY ROW_ID) AS RNUM\n            FROM {{ ref_no_link('PLANNING_ALLIANT_STAGING',\
      \ 'TMP_NEW_PLANNING_BROKER') }}\n            WHERE GROUP_ID IS NULL\n      \
      \  ) AS SRC\n        WHERE T.ROW_ID = SRC.ROW_ID AND SRC.RNUM <= (CAST(:NO_ROWS\
      \ AS INT) - :COUNT_OF_MAX_GROUP_ID);\n    END IF;\n\n    UPDATE {{ ref_no_link('PLANNING_ALLIANT_STAGING',\
      \ 'TMP_NEW_PLANNING_BROKER') }} AS T\n    SET\n        T.GROUP_ID = GRP.NEW_GROUP_ID,\n\
      \        T.GROUP_NAME = GRP.NEW_GROUP_ID || '_Producer_Parent',\n        T.PARENT_PLANNING_ID\
      \ = GRP.NEW_GROUP_ID || '_Producer_Parent'\n    FROM (\n        SELECT\n   \
      \         ROW_ID,\n            (COALESCE(:MAX_GROUP_ID, 0) + 1 +\n         \
      \   FLOOR((ROW_NUMBER() OVER (ORDER BY ROW_ID) - 1) / :NO_ROWS)) AS NEW_GROUP_ID\n\
      \        FROM {{ ref_no_link('PLANNING_ALLIANT_STAGING', 'TMP_NEW_PLANNING_BROKER')\
      \ }}\n        WHERE GROUP_ID IS NULL\n    ) AS GRP\n    WHERE T.ROW_ID = GRP.ROW_ID;\n\
      END;"
    preSQL: ''
    testsEnabled: true
    truncateBefore: true
